name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate website
        env:
          POSTHOG_PUBLIC_TOKEN: ${{ vars.POSTHOG_PUBLIC_TOKEN }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: |
          if [ -z "$POSTHOG_PUBLIC_TOKEN" ]; then
            echo "POSTHOG_PUBLIC_TOKEN repository variable is missing."
            exit 1
          fi
          npm test
          npm run build

      - name: Stage public website
        run: |
          mkdir _site
          cp ./*.html CNAME robots.txt site.webmanifest sitemap.xml styles.css _site/
          cp -R alcohol-unit-calculator assets blog de discover es fr id it ja pt science scripts shared _site/
          rm -f _site/scripts/build-analytics-assets.js
          rm -f _site/scripts/update-analytics-loaders.js
          rm -f _site/scripts/update-sitemap-lastmod.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
